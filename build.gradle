plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'be.yvanmazy'
version = '1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Code style
    api 'org.jetbrains:annotations:26.1.0'

    // Logging
    api 'org.tinylog:slf4j-tinylog:2.7.0'
    api 'org.tinylog:tinylog-impl:2.7.0'

    // Arguments
    api 'org.jcommander:jcommander:3.0'

    // Json
    api 'com.google.code.gson:gson:2.14.0'

    // Byte code
    api 'net.md-5:SpecialSource:1.11.6'
    api 'org.vineflower:vineflower:1.12.0'

    // Testing
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

shadowJar {
    manifest {
        attributes 'Main-Class': 'be.yvanmazy.minecraftremapper.Main'
    }
    archiveClassifier.set('')
}

test {
    useJUnitPlatform()
}